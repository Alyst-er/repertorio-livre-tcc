<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Repertório Livre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>.admin-main{padding:55px 0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.admin-stat{padding:20px}.admin-stat strong{display:block;font:700 32px var(--serif);color:var(--gold2)}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:12px}.admin-table th{color:var(--muted);font:600 10px var(--mono);text-transform:uppercase}.danger-button{border-color:#ef8c864d;color:var(--danger)}@media(max-width:680px){.admin-grid{grid-template-columns:1fr}.admin-table{display:block;overflow:auto;white-space:nowrap}}</style>
</head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="mark">RL</span><span><strong>Repertório Livre</strong><small>Administração do sistema</small></span><em>● Mestre</em></a><div><a class="button small" href="index.html">Voltar ao site</a> <button class="button small" id="logout">Sair</button></div></div></header><main class="admin-main"><div class="container"><span class="eyebrow">Acesso restrito</span><h1>Painel mestre</h1><p class="muted">Apenas a conta administrativa configurada pode consultar e apagar registros pela API.</p><div id="message" class="auth-error"></div><div id="stats" class="admin-grid"></div><section class="panel"><h2>Usuários cadastrados</h2><div id="users"></div></section><section class="panel"><h2>Repertórios armazenados</h2><div id="repertoires"></div></section></div></main><script>
(async()=>{const msg=document.getElementById('message');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/admin/overview');const d=await r.json();if(!r.ok){msg.textContent=d.error||'Acesso negado.';setTimeout(()=>location.href='login.html',900);return;}document.getElementById('stats').innerHTML=[['Usuários',d.users.length],['Repertórios',d.repertoires.length],['Bandas',d.bands.length]].map(x=>`<div class="panel admin-stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');document.getElementById('users').innerHTML=d.users.length?`<table class="admin-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Tipo</th><th>Ação</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.is_admin?'Mestre':'Usuário'}</td><td>${u.is_admin?'Conta protegida':`<button class="button small danger-button" data-user="${u.id}">Apagar</button>`}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum usuário cadastrado.</div>';document.getElementById('repertoires').innerHTML=d.repertoires.length?`<table class="admin-table"><thead><tr><th>Nome</th><th>Visibilidade</th><th>Ação</th></tr></thead><tbody>${d.repertoires.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.visibility)}</td><td><button class="button small danger-button" data-rep="${x.id}">Apagar</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum repertório cadastrado.</div>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{if(confirm('Apagar este usuário e seus acessos?')){await fetch('/api/admin/users/'+b.dataset.user,{method:'DELETE'});load();}});document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=async()=>{if(confirm('Apagar este repertório?')){await fetch('/api/admin/repertoires/'+b.dataset.rep,{method:'DELETE'});load();}});}document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='login.html';};load();})();
</script></body></html>
